name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  phpunit:
    name: PHP Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPUnit
        run: cd tests && ../vendor/bin/phpunit --configuration phpunit.xml --testdox

  playwright:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    if: false
    needs: phpunit
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: cd tests && npm ci && npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: cd tests && npx playwright test --project=chromium
