name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── PHP Unit Tests ───────────────────────────────────────────────────────────
  phpunit:
    name: PHP Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPUnit
        run: ./vendor/bin/phpunit tests/phpunit.xml --testdox

  # ── Playwright E2E Tests ──────────────────────────────────────────────────────
  playwright:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: phpunit   # unit tests must pass before spinning up WP

    services:
      db:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      wordpress:
        image: wordpress:latest
        ports:
          - 8080:80
        env:
          WORDPRESS_DB_HOST: db
          WORDPRESS_DB_NAME: wordpress
          WORDPRESS_DB_USER: wordpress
          WORDPRESS_DB_PASSWORD: wordpress
          WORDPRESS_DEBUG: '1'
          WP_ENVIRONMENT_TYPE: local   # enables lgw_seed_test_clubs()
        options: >-
          --health-cmd="curl -f http://localhost:80/wp-login.php || exit 1"
          --health-interval=15s
          --health-timeout=10s
          --health-retries=8

    steps:
      - uses: actions/checkout@v4

      - name: Copy plugin into WordPress container
        run: |
          # Copy all plugin files (excludes tests/ dir per release.yml convention)
          docker cp . $(docker ps -qf "ancestor=wordpress:latest"):/var/www/html/wp-content/plugins/lgw-division-widget

      - name: Setup CI WordPress environment
        env:
          WP_CONTAINER: ${{ job.container.id }}
        run: bash tests/ci/setup-wp.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json

      - name: Install Playwright dependencies
        run: cd tests && npm ci && npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        env:
          LGW_BASE_URL: http://localhost:8080
          LGW_TEST_PAGE: /test-division/
          WP_USER: admin
          WP_PASS: password
          WP_CONTAINER: ${{ job.container.id }}
        run: cd tests && npx playwright test --project=chromium

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/test-results/
          retention-days: 7
